<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dashboard DevOps</title>
</head>
<body>
<h1>Login</h1>
<p th:if="${param.registered}">Cadastro concluído com sucesso.</p>
<p th:if="${param.error}">Credenciais inválidas.</p>
<p th:if="${param.logout}">Você saiu da sessão.</p>
<form th:action="@{/login}" method="post">
    <label for="username">E-mail</label>
    <input id="username" type="email" name="username" required />

    <label for="password">Senha</label>
    <input id="password" type="password" name="password" required minlength="8" />

    <button type="submit">Entrar</button>
</form>
<p>Não tem conta? <a th:href="@{/register}">Cadastrar</a></p>
</body>
</html>
